<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="760" viewBox="0 0 1024 760" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8064a2"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#77933c"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d46a1a"/>
    </marker>
  </defs>

  <rect width="1024" height="760" fill="#ffffff"/>

  <!-- 3D payload region -->
  <path d="M235,420 L772,420 Q800,420 800,448 L800,672 Q800,700 772,700 L178,700 Q150,700 150,672 L150,560 Q150,470 235,420 Z"
        fill="#ebf1de" stroke="#77933c" stroke-width="3" stroke-dasharray="10,7"/>

  <!-- OPC root relationships bar -->
  <rect x="10" y="8" width="58" height="700" rx="10" fill="#b9cde5" stroke="#1f2a5a" stroke-width="3"/>
  <text x="39" y="358" font-size="26" fill="#1f1f1f" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 39 358)">OPC Root Relationships</text>

  <!-- OPC package parts -->
  <g fill="#e6e0ec" stroke="#8064a2" stroke-width="3">
    <ellipse cx="375" cy="65" rx="120" ry="30"/>
    <ellipse cx="375" cy="148" rx="120" ry="30"/>
    <ellipse cx="392" cy="246" rx="120" ry="30"/>
    <ellipse cx="375" cy="230" rx="120" ry="30"/>
    <ellipse cx="392" cy="346" rx="120" ry="30"/>
    <ellipse cx="375" cy="330" rx="120" ry="30"/>
  </g>
  <g font-size="22" fill="#1f1f1f" text-anchor="middle">
    <text x="375" y="58">Package</text>
    <text x="375" y="84">Thumbnail</text>
    <text x="375" y="141">Core</text>
    <text x="375" y="167">Properties</text>
    <text x="375" y="223">Digital</text>
    <text x="375" y="249">Signature</text>
    <text x="375" y="338">Custom Part</text>
  </g>

  <g stroke="#8064a2" stroke-width="2.5" marker-end="url(#arrow-purple)">
    <line x1="68" y1="65" x2="253" y2="65"/>
    <line x1="68" y1="148" x2="253" y2="148"/>
    <line x1="68" y1="230" x2="253" y2="230"/>
    <line x1="68" y1="330" x2="253" y2="330"/>
  </g>
  <g font-size="16" fill="#1f1f1f">
    <text x="80" y="56">Thumbnail</text>
    <text x="80" y="139">Core Properties</text>
    <text x="80" y="221">Digital Signatures</text>
    <text x="80" y="321">Must Preserve</text>
  </g>

  <path d="M502,25 Q532,25 532,55 L532,180 Q532,210 557,210 Q532,210 532,240 L532,365 Q532,395 502,395"
        fill="none" stroke="#8064a2" stroke-width="2.5"/>
  <text x="572" y="218" font-size="22" fill="#1f1f1f">OPC Package Parts</text>

  <!-- 3D payload -->
  <rect x="258" y="446" width="187" height="72" rx="8" fill="#ebf1de" stroke="#77933c" stroke-width="3"/>
  <text x="351" y="490" font-size="24" fill="#1f1f1f" text-anchor="middle">3D Model</text>

  <line x1="68" y1="466" x2="256" y2="466" stroke="#77933c" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="80" y="457" font-size="16" fill="#1f1f1f">3D Model</text>

  <line x1="68" y1="502" x2="256" y2="502" stroke="#d46a1a" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#arrow-orange)"/>
  <text x="80" y="494" font-size="16" fill="#1f1f1f">Document Purpose</text>
  <text x="80" y="521" font-size="13" font-style="italic" fill="#5a5a5a">(optional)</text>

  <line x1="445" y1="482" x2="568" y2="482" stroke="#77933c" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="455" y="471" font-size="16" fill="#1f1f1f">PrintTicket</text>
  <ellipse cx="677" cy="482" rx="106" ry="30" fill="#ebf1de" stroke="#77933c" stroke-width="3"/>
  <text x="677" y="490" font-size="22" fill="#1f1f1f" text-anchor="middle">PrintTicket</text>

  <g stroke="#77933c" stroke-width="2.5" marker-end="url(#arrow-green)">
    <line x1="318" y1="518" x2="252" y2="590"/>
    <line x1="388" y1="518" x2="438" y2="590"/>
  </g>
  <text x="182" y="552" font-size="16" fill="#1f1f1f">Thumbnail</text>
  <text x="412" y="552" font-size="16" fill="#1f1f1f">3D Texture</text>

  <g fill="#ebf1de" stroke="#77933c" stroke-width="3">
    <ellipse cx="274" cy="650" rx="85" ry="28"/>
    <ellipse cx="258" cy="636" rx="85" ry="28"/>
    <ellipse cx="242" cy="622" rx="85" ry="28"/>
    <ellipse cx="472" cy="650" rx="85" ry="28"/>
    <ellipse cx="456" cy="636" rx="85" ry="28"/>
    <ellipse cx="440" cy="622" rx="85" ry="28"/>
  </g>
  <g font-size="18" fill="#1f1f1f" text-anchor="middle">
    <text x="242" y="617">Object</text>
    <text x="242" y="639">Thumbnail</text>
    <text x="440" y="617">3D</text>
    <text x="440" y="639">Texture</text>
  </g>

  <path d="M812,422 Q842,422 842,452 L842,533 Q842,563 867,563 Q842,563 842,593 L842,665 Q842,695 812,695"
        fill="none" stroke="#77933c" stroke-width="2.5"/>
  <text x="880" y="571" font-size="22" fill="#1f1f1f">3D Payload</text>

  <!-- legend -->
  <line x1="80" y1="740" x2="120" y2="740" stroke="#d46a1a" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#arrow-orange)"/>
  <text x="132" y="745" font-size="15" fill="#1f1f1f">Document Purpose: Model, Build, Project, Toolpath or Slices. One or more per package, each targeting the 3D Model part.</text>
</svg>
